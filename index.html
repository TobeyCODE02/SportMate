<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SportMate</title>
    <style>
      :root {
        --bg: #f3f6ff;
        --surface: #ffffff;
        --line: #dbe2f0;
        --text: #111827;
        --muted: #64748b;
        --blue: #2f6bff;
      }
      * { box-sizing: border-box; }
      body { margin: 0; font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background: var(--bg); color: var(--text); }
      .app { min-height: 100vh; width: 100vw; }
      .header { position: sticky; top: 0; z-index: 20; background: #ffffffea; backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); padding: 10px 14px; display: flex; justify-content: space-between; align-items: center; }
      .logo { font-weight: 900; letter-spacing: -0.02em; }
      .tabs { display: flex; gap: 6px; }
      .tab { border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 7px 12px; font-size: 12px; font-weight: 700; cursor: pointer; }
      .tab.active { background: #dbeafe; border-color: #93c5fd; color: #1d4ed8; }
      main { max-width: 920px; margin: 0 auto; padding: 14px; }
      .card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px; }
      h1, h2, h3 { margin: 0; letter-spacing: -0.02em; }
      .muted { color: var(--muted); font-size: 13px; }
      .sp { height: 10px; }
      .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
      .chip { border: 1px solid var(--line); border-radius: 999px; background: #fff; padding: 8px 12px; font-weight: 700; font-size: 13px; cursor: pointer; }
      .chip.on { background: #dbeafe; border-color: #93c5fd; color: #1d4ed8; }
      .row { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
      .progress { margin-top: 10px; height: 10px; border: 1px solid var(--line); background: #eaf0ff; border-radius: 999px; overflow: hidden; }
      .progress > div { height: 100%; background: linear-gradient(90deg, #2f6bff, #14b8a6); width: 0%; transition: width .2s; }
      button.primary { border: 0; border-radius: 12px; background: linear-gradient(180deg, #2f6bff, #2457d9); color: #fff; padding: 10px 14px; font-weight: 800; cursor: pointer; }
      button.ghost { border: 1px solid var(--line); border-radius: 12px; background: #fff; color: #334155; padding: 10px 14px; font-weight: 700; cursor: pointer; }
      .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
      @media (max-width: 900px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
      @media (max-width: 600px) { .grid { grid-template-columns: 1fr; } }
      .sport { overflow: hidden; border-radius: 14px; border: 1px solid var(--line); background: #fff; }
      .thumb { height: 130px; background: linear-gradient(135deg, #bfdbfe, #a7f3d0); position: relative; }
      .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
      .sport .body { padding: 10px; }
      .name { font-weight: 800; }
      .tags { color: var(--muted); font-size: 12px; margin-top: 3px; }
      .resultHero { border-radius: 14px; overflow: hidden; border: 1px solid var(--line); }
      .resultHero .thumb { height: 180px; }
      .list { margin: 8px 0 0 16px; padding: 0; }
      .search { width: 100%; border: 1px solid var(--line); border-radius: 12px; background: #fff; padding: 10px 12px; font-weight: 700; }
    </style>
  </head>
  <body>
    <div class="app">
      <header class="header">
        <div class="logo">SportMate</div>
        <nav class="tabs">
          <button class="tab active" data-view="quiz">Quiz</button>
          <button class="tab" data-view="directory">Verzeichnis</button>
          <button class="tab" data-view="result">Ergebnis</button>
        </nav>
      </header>
      <main>
        <section id="quizView"></section>
        <section id="directoryView" hidden></section>
        <section id="resultView" hidden></section>
      </main>
    </div>

    <script>
      const SPORTS = [
        ['Yoga','yoga', ['ruhig','low','solo','indoor','mindful']], ['Pilates','pilates', ['ruhig','low','solo','indoor']], ['Tai Chi','tai chi', ['ruhig','low','solo','outdoor']], ['Qigong','qigong', ['ruhig','low','solo','outdoor']],
        ['Spazieren','walking', ['ruhig','low','solo','outdoor']], ['Nordic Walking','nordic walking', ['ruhig','low','solo','outdoor']], ['Wandern','hiking', ['natur','medium','solo','outdoor']], ['Schwimmen','swimming', ['wasser','low','solo','indoor']],
        ['Aquajogging','aqua jogging', ['wasser','low','solo','indoor']], ['SUP','stand up paddling', ['wasser','medium','solo','outdoor']], ['Kajak','kayaking', ['wasser','medium','team','outdoor']], ['Rudern','rowing', ['wasser','medium','team','outdoor']],
        ['Segeln','sailing', ['wasser','low','team','outdoor']], ['Tauchen','scuba diving', ['wasser','medium','team','outdoor']], ['Tanzen','dance class', ['spass','medium','team','indoor']], ['Zumba','zumba class', ['spass','medium','team','indoor']],
        ['Salsa','salsa dance', ['spass','medium','team','indoor']], ['Ballett','ballet class', ['kreativ','medium','team','indoor']], ['Fussball','football', ['spass','high','team','outdoor']], ['Basketball','basketball', ['spass','high','team','indoor']],
        ['Volleyball','volleyball', ['spass','high','team','indoor']], ['Beachvolleyball','beach volleyball', ['spass','high','team','outdoor']], ['Handball','handball', ['spass','high','team','indoor']], ['Tennis','tennis', ['challenge','medium','solo','outdoor']],
        ['Badminton','badminton', ['spass','medium','team','indoor']], ['Squash','squash', ['challenge','high','solo','indoor']], ['Tischtennis','table tennis', ['spass','low','team','indoor']], ['Padel','padel tennis', ['spass','medium','team','outdoor']],
        ['Radfahren','cycling', ['natur','medium','solo','outdoor']], ['Mountainbike','mountain biking', ['natur','high','solo','outdoor']], ['Spinning','spinning class', ['challenge','high','team','indoor']], ['Joggen','running', ['challenge','high','solo','outdoor']],
        ['Trailrunning','trail running', ['challenge','high','solo','outdoor']], ['Gym Krafttraining','weight training gym', ['challenge','medium','solo','indoor']], ['HIIT','hiit workout', ['challenge','high','solo','indoor']], ['Boxen','boxing', ['challenge','high','solo','indoor']],
        ['Judo','judo', ['challenge','high','team','indoor']], ['Karate','karate', ['challenge','medium','team','indoor']], ['Bouldern','bouldering', ['challenge','high','team','indoor']], ['Klettern Halle','indoor climbing', ['challenge','high','team','indoor']],
        ['Klettern Outdoor','rock climbing', ['challenge','high','team','outdoor']], ['Skifahren','skiing', ['spass','high','team','outdoor']], ['Snowboard','snowboarding', ['spass','high','team','outdoor']], ['Langlauf','cross country skiing', ['natur','medium','solo','outdoor']],
        ['Eislaufen','ice skating', ['spass','medium','team','indoor']], ['Bowling','bowling', ['spass','low','team','indoor']], ['Billard','billiards', ['ruhig','low','team','indoor']], ['Darts','darts', ['spass','low','team','indoor']],
        ['Bogenschiessen','archery', ['mindful','low','solo','outdoor']], ['Golf','golf', ['ruhig','low','solo','outdoor']], ['Inline Skating','inline skating', ['spass','high','solo','outdoor']], ['Skateboard','skateboard', ['challenge','high','solo','outdoor']],
        ['Parkour','parkour', ['challenge','high','solo','outdoor']], ['Slackline','slackline', ['mindful','medium','solo','outdoor']], ['Ultimate Frisbee','ultimate frisbee', ['spass','high','team','outdoor']], ['Disc Golf','disc golf', ['natur','low','team','outdoor']],
        ['Fechten','fencing', ['challenge','medium','team','indoor']], ['Geocaching','geocaching', ['natur','low','team','outdoor']], ['Reiten','horse riding', ['natur','medium','solo','outdoor']], ['Surfen','surfing', ['wasser','high','solo','outdoor']]
      ].map((x, i) => ({ id: i + 1, name: x[0], query: x[1], tags: x[2] }));

      const EMOJI_MAP = [
        ['wasser', '🏄'], ['natur', '🌿'], ['team', '🤝'], ['solo', '🧘'],
        ['challenge', '⚡'], ['spass', '🎉'], ['ruhig', '🌙'], ['kreativ', '🎨'], ['mindful', '🧠']
      ];

      function pickEmoji(tags) {
        for (const [tag, emoji] of EMOJI_MAP) {
          if (tags.includes(tag)) return emoji;
        }
        return '🏅';
      }

      function hashColor(name) {
        let h = 0;
        for (let i = 0; i < name.length; i += 1) h = (h * 31 + name.charCodeAt(i)) % 360;
        return h;
      }

      function cartoonImage(name, tags) {
        const hue = hashColor(name);
        const hue2 = (hue + 45) % 360;
        const emoji = pickEmoji(tags);
        const shortName = name.length > 14 ? `${name.slice(0, 12)}…` : name;
        const svg = `
          <svg xmlns='http://www.w3.org/2000/svg' width='640' height='420' viewBox='0 0 640 420'>
            <defs>
              <linearGradient id='g' x1='0' y1='0' x2='1' y2='1'>
                <stop offset='0%' stop-color='hsl(${hue} 80% 78%)'/>
                <stop offset='100%' stop-color='hsl(${hue2} 80% 72%)'/>
              </linearGradient>
            </defs>
            <rect width='640' height='420' fill='url(#g)'/>
            <g opacity='0.28'>
              <circle cx='95' cy='95' r='86' fill='white'/>
              <circle cx='560' cy='320' r='120' fill='white'/>
            </g>
            <rect x='26' y='24' width='214' height='48' rx='24' fill='rgba(255,255,255,0.88)'/>
            <text x='42' y='55' font-family='Inter, Arial, sans-serif' font-size='24' font-weight='700' fill='#0f172a'>SportMate</text>
            <text x='320' y='228' text-anchor='middle' font-size='118'>${emoji}</text>
            <rect x='36' y='338' width='568' height='54' rx='16' fill='rgba(17,24,39,0.72)'/>
            <text x='58' y='372' font-family='Inter, Arial, sans-serif' font-size='29' font-weight='800' fill='white'>${shortName}</text>
          </svg>
        `;
        return `data:image/svg+xml;utf8,${encodeURIComponent(svg)}`;
      }

      const SPORTS_WITH_IMAGES = SPORTS.map((sport) => ({
        ...sport,
        image: cartoonImage(sport.name, sport.tags),
      }));

      const QUESTIONS = [
        { q: 'Was suchst du am meisten?', key: 'goal', opts: [['Entspannung','ruhig'], ['Spaß','spass'], ['Challenge','challenge'], ['Kreativ','kreativ']] },
        { q: 'Wo möchtest du lieber trainieren?', key: 'place', opts: [['Outdoor','outdoor'], ['Indoor','indoor'], ['Egal','either']] },
        { q: 'Solo oder mit anderen?', key: 'group', opts: [['Solo','solo'], ['Team','team'], ['Beides','either']] },
        { q: 'Wie intensiv darf es sein?', key: 'intensity', opts: [['Low','low'], ['Medium','medium'], ['High','high']] },
        { q: 'Magst du Wasser?', key: 'water', opts: [['Ja','wasser'], ['Nicht wichtig','none'], ['Nein','nowater']] },
        { q: 'Natur wichtig?', key: 'nature', opts: [['Ja','natur'], ['Egal','none'], ['Nein','nonatur']] },
        { q: 'Budget?', key: 'budget', opts: [['Niedrig','budget_low'], ['Mittel','budget_mid'], ['Hoch ok','budget_high']] },
        { q: 'Ausrüstung?', key: 'gear', opts: [['Keine/Basic','basic'], ['Etwas ok','mid'], ['Spezial ok','pro']] },
        { q: 'Gesundheitsfokus?', key: 'health', opts: [['Gelenkschonend','low'], ['Normal','none'], ['Action ok','high']] },
        { q: 'Wie schnell starten?', key: 'start', opts: [['Sofort einfach','easy'], ['Darf lernen brauchen','learn'], ['Egal','none']] },
      ];

      const state = {
        view: 'quiz',
        step: 0,
        answers: {},
        result: null,
        query: '',
      };

      const quizView = document.getElementById('quizView');
      const directoryView = document.getElementById('directoryView');
      const resultView = document.getElementById('resultView');
      const tabs = [...document.querySelectorAll('.tab')];

      function setView(v) {
        state.view = v;
        quizView.hidden = v !== 'quiz';
        directoryView.hidden = v !== 'directory';
        resultView.hidden = v !== 'result';
        tabs.forEach((b) => b.classList.toggle('active', b.dataset.view === v));
        render();
      }

      function scoreSport(s) {
        const a = state.answers;
        let score = 0;
        const has = (tag) => s.tags.includes(tag);
        if (a.goal && has(a.goal)) score += 6;
        if (a.place && a.place !== 'either' && has(a.place)) score += 4;
        if (a.group && a.group !== 'either' && has(a.group)) score += 4;
        if (a.intensity && has(a.intensity)) score += 5;
        if (a.water === 'wasser' && has('wasser')) score += 6;
        if (a.water === 'nowater' && has('wasser')) score -= 4;
        if (a.nature === 'natur' && has('natur')) score += 4;
        if (a.nature === 'nonatur' && has('natur')) score -= 3;
        if (a.health === 'low' && has('high')) score -= 4;
        if (a.health === 'high' && has('high')) score += 2;
        if (a.start === 'easy' && has('challenge')) score -= 2;
        if (a.start === 'learn' && has('challenge')) score += 2;
        return score;
      }

      function calculateResult() {
        const ranked = SPORTS_WITH_IMAGES.map((s) => ({ ...s, score: scoreSport(s) })).sort((a, b) => b.score - a.score);
        state.result = ranked[0];
      }

      function renderQuiz() {
        const item = QUESTIONS[state.step];
        const progress = ((state.step + 1) / QUESTIONS.length) * 100;
        quizView.innerHTML = `
          <div class="card">
            <div class="row"><h2>Quiz · Frage ${state.step + 1}/10</h2><span class="muted">Hobby-Match</span></div>
            <div class="muted" style="margin-top:4px">${item.q}</div>
            <div class="progress"><div style="width:${progress}%"></div></div>
            <div class="chips">
              ${item.opts.map(([label, val]) => `<button class="chip ${state.answers[item.key] === val ? 'on' : ''}" data-answer="${val}">${label}</button>`).join('')}
            </div>
            <div class="sp"></div>
            <div class="row">
              <button class="ghost" ${state.step === 0 ? 'disabled' : ''} data-back="1">Zurück</button>
              <button class="primary" data-next="1">${state.step === QUESTIONS.length - 1 ? 'Ergebnis anzeigen' : 'Weiter'}</button>
            </div>
          </div>
        `;
      }

      function cardHtml(s) {
        return `<article class="sport"><div class="thumb"><img src="${s.image}" alt="${s.name}" loading="lazy"></div><div class="body"><div class="name">${s.name}</div><div class="tags">${s.tags.join(' · ')}</div></div></article>`;
      }

      function renderDirectory() {
        const q = state.query.trim().toLowerCase();
        const list = SPORTS_WITH_IMAGES.filter((s) => !q || s.name.toLowerCase().includes(q) || s.tags.join(' ').includes(q));
        directoryView.innerHTML = `
          <div class="card">
            <div class="row"><h2>Sportarten Verzeichnis</h2><span class="muted">${list.length} von ${SPORTS.length}</span></div>
            <div class="sp"></div>
            <input class="search" placeholder="Suche z.B. Wasser, Team, Yoga..." value="${state.query}" />
          </div>
          <div class="sp"></div>
          <div class="grid">${list.map(cardHtml).join('')}</div>
        `;
        directoryView.querySelector('.search').addEventListener('input', (e) => { state.query = e.target.value; renderDirectory(); });
      }

      function renderResult() {
        if (!state.result) {
          resultView.innerHTML = `<div class="card"><h2>Noch kein Ergebnis</h2><div class="muted" style="margin-top:6px">Bitte zuerst das Quiz ausfüllen.</div><div class="sp"></div><button class="primary" data-gotoquiz="1">Zum Quiz</button></div>`;
          return;
        }
        const best = state.result;
        const alternatives = SPORTS_WITH_IMAGES.filter((s) => s.id !== best.id).sort((a, b) => scoreSport(b) - scoreSport(a)).slice(0, 6);
        resultView.innerHTML = `
          <div class="card">
            <h2>Dein bestes Match</h2>
            <div class="muted" style="margin-top:4px">Basierend auf 10 Fragen</div>
            <div class="sp"></div>
            <div class="resultHero"><div class="thumb"><img src="${best.image}" alt="${best.name}"></div></div>
            <div class="sp"></div>
            <h3>${best.name}</h3>
            <div class="muted">Tags: ${best.tags.join(' · ')}</div>
            <ul class="list"><li>Passt zu deinem Zielprofil.</li><li>Gut für deinen gewünschten Rahmen (Ort/Intensität).</li><li>Direkt als Hobby einsteigbar.</li></ul>
            <div class="row"><button class="ghost" data-gotoquiz="1">Quiz neu starten</button><button class="primary" data-gotodir="1">Alle Sportarten</button></div>
          </div>
          <div class="sp"></div>
          <div class="grid">${alternatives.map(cardHtml).join('')}</div>
        `;
      }

      function render() {
        if (state.view === 'quiz') renderQuiz();
        if (state.view === 'directory') renderDirectory();
        if (state.view === 'result') renderResult();
      }

      document.body.addEventListener('click', (e) => {
        const t = e.target;
        if (!(t instanceof HTMLElement)) return;
        const tab = t.closest('[data-view]');
        if (tab) return setView(tab.dataset.view);

        if (t.dataset.answer) {
          const key = QUESTIONS[state.step].key;
          state.answers[key] = t.dataset.answer;
          return renderQuiz();
        }
        if (t.dataset.back && state.step > 0) {
          state.step -= 1;
          return renderQuiz();
        }
        if (t.dataset.next) {
          const key = QUESTIONS[state.step].key;
          if (!state.answers[key]) return;
          if (state.step < QUESTIONS.length - 1) {
            state.step += 1;
            return renderQuiz();
          }
          calculateResult();
          return setView('result');
        }
        if (t.dataset.gotoquiz) {
          state.step = 0;
          state.answers = {};
          state.result = null;
          return setView('quiz');
        }
        if (t.dataset.gotodir) return setView('directory');
      });

      setView('quiz');
    </script>
  </body>
</html>
